<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon source. PNGs in this folder are rendered from it. Safe zone for maskable: centre 80%. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#0d2238"/><stop offset=".55" stop-color="#060c17"/><stop offset="1" stop-color="#03050a"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffb84a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- perspective floor -->
  <g stroke="#5ad7ff" stroke-width="2" opacity=".28" fill="none">
    <path d="M86 430 H426 M118 382 H394 M144 343 H368 M164 312 H348"/>
    <path d="M86 430 L164 312 M171 430 L210 312 M256 430 V312 M341 430 L302 312 M426 430 L348 312"/>
  </g>
  <!-- hex ring -->
  <path d="M256 70 L398 152 V316 L256 398 L114 316 V152 Z" fill="rgba(90,215,255,.06)" stroke="#5ad7ff" stroke-width="6" filter="url(#g)"/>
  <!-- the star -->
  <circle cx="256" cy="234" r="130" fill="url(#halo)"/>
  <path d="M256 128 L277 213 L362 234 L277 255 L256 340 L235 255 L150 234 L235 213 Z" fill="#ffb84a" filter="url(#g)"/>
  <circle cx="256" cy="234" r="12" fill="#fff7e8"/>
</svg>
